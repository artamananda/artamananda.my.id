name: Deploy Web Staging
on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions: write-all

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Web Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          git fetch origin
          git checkout staging
          git pull origin staging

      - name: "Automated Version Bump"
        uses: "phips28/gh-action-bump-version@master"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          minor-wording: "add,Adds,new,feat,feature"
          major-wording: "MAJOR,cut-major"
          patch-wording: "patch,fixes,fix,adjust"
          rc-wording: "RELEASE,alpha"
          target-branch: "staging"
          commit-message: "CI: bumps version to {{version}} [skip ci]"

      - name: "Setup Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - uses: culshaw/read-package-node-version-actions@v1
        id: package-json

      - name: Show version number
        run: echo "${{ steps.package-json.outputs.version }}"

      - name: "cat package.json"
        run: cat ./package.json

      - name: Yarn install
        run: yarn install

      - name: "Create .env file"
        run: |
          touch .env
          echo NODE_ENV=production >> .env
          echo STAGE=production >> .env
          echo HTTP_PORT=3000 >> .env
          echo APP_NAME=Artamananda >> .env
          echo APP_VERSION=${{ steps.package-json.outputs.version }} >> .env
          echo APP_URL=artamananda.my.id >> .env
          echo BASE_API_URL=${{ secrets.BASE_API_URL }} >> .env
          echo STORAGE_URL=${{ secrets.STORAGE_URL }} >> .env
          echo DATABASE_URL=postgres://postgres:postgres@localhost:5432/arta_web?schema=public >> .env
          cat .env

      - name: Build
        env:
          CI: false
        run: yarn build

      - name: Upload to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST_STAGING }}
          username: ${{ secrets.SSH_USER_STAGING }}
          port: ${{ secrets.SSH_PORT_STAGING }}
          password: ${{ secrets.SSH_PASS_STAGING }}
          source: "./,!node_modules"
          target: "/var/www/html/apps/arta-web"
          rm: true

      - name: Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_STAGING }}
          username: ${{ secrets.SSH_USER_STAGING }}
          port: ${{ secrets.SSH_PORT_STAGING }}
          password: ${{ secrets.SSH_PASS_STAGING }}
          script: |
            cd /var/www/html/apps/arta-web
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            yarn install
            # sudo kill -9 `sudo lsof -t -i:3000`
            pm2 delete arta-web
            # pm2 start yarn --name arta-web -- start -- -p 3000
            pm2 start
